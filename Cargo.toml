[package]
name = "git-extractor"
version = "0.1.0"
edition = "2021"
description = "Dump exposed .git directories over HTTP and extract Git objects, including packed and unreachable ones"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
colored = "2"
indicatif = "0.17"
rayon = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tar = "0.4"
flate2 = "1"
regex = "1"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "rustls-tls"] }
sha1 = "0.10"

[[bin]]
name = "git-extractor"
path = "src/main.rs"

[[bin]]
name = "git-dumper"
path = "src/bin/git-dumper.rs"
